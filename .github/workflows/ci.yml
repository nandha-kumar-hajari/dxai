name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check (every src + bin .js)
        run: |
          node -e "
            const fs=require('fs'),path=require('path');
            const walk=(d)=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{
              const p=path.join(d,e.name);
              return e.isDirectory()?walk(p):p.endsWith('.js')?[p]:[];
            });
            const files=[...walk('src'),...walk('bin')];
            for(const f of files){require('child_process').execSync(\`node --check \${f}\`,{stdio:'inherit'})}
          "

      - name: Run tests
        run: npm test

      - name: Smoke (--help / --version)
        run: |
          node bin/cli.js --version
          node bin/cli.js --help

  docs-check:
    name: docs drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gen-changelog.mjs needs full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify generated docs match committed
        run: npm run docs:check
