name: Catalog Health

# Self-running guardrail for the catalogue (see AGENTS.md → Release & Versioning).
# Validates entry shape on every change, and weekly checks pinned versions vs npm
# `latest`, that server URLs resolve, and that the agent definitions in
# src/detect.js are still current (review window, install channels, docs URLs) —
# opening an issue when something drifts, so the maintainer acts on a
# notification rather than babysitting upstream.

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  pull_request:
    paths:
      - 'src/registry/data/**'
      - 'src/registry/**'
      - 'src/detect.js'
      - 'test/registry-schema.test.js'
      - 'scripts/catalog-health.mjs'
      - 'scripts/agent-health.mjs'
      - 'test/detect.test.js'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    name: validate catalogue entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate registry schema + derivation
        run: node --test test/registry-schema.test.js test/detect.test.js

  health:
    name: pin + URL drift
    # Schedule/manual only — no need to hit npm and remote URLs on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run catalogue health check
        id: health
        run: node scripts/catalog-health.mjs

      - name: Open issue on drift
        if: steps.health.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('catalog-health-report.md', 'utf8');
            const title = 'Catalogue health: pinned versions or URLs need attention';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'catalog-health',
            });
            const found = existing.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['catalog-health'],
              });
            }

  agent-health:
    name: agent definition drift
    # The tools dxai configures rename themselves, move config files and retire
    # install channels far more often than dxai ships. Every AGENT_DEFINITIONS
    # entry carries the docs it was verified against and when; this job flags
    # entries past the review window, vanished/deprecated brew casks and winget
    # packages, and docs URLs that moved — so a Windsurf→Devin style rename
    # opens an issue instead of silently breaking detection.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run agent definition health check
        id: agents
        run: node scripts/agent-health.mjs

      - name: Open issue on drift
        if: steps.agents.outputs.has_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('agent-health-report.md', 'utf8');
            const title = 'Agent definitions: re-verify against vendor docs';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'agent-health',
            });
            const found = existing.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['agent-health'],
              });
            }

  sync:
    name: registry sync
    # Resolve every registry-linked catalogue entry from the official MCP
    # Registry and open/update a PR when something changed. A PR opened with
    # GITHUB_TOKEN does not trigger CI on its own; tests and docs are run here
    # first so the PR is known-good, and CI runs again on any human push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SYNC_BRANCH: bot/registry-sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Resolve catalogue from the MCP Registry
        id: sync
        run: node scripts/registry-sync.mjs

      - name: Verify the synced catalogue
        if: steps.sync.outputs.has_changes == 'true'
        run: |
          npm test
          npm run docs:generate

      - name: Open or update the sync PR
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add src/registry/data/mcp-servers.json docs/src/content/docs
          git commit -m "chore(registry): sync catalogue from the MCP Registry"
          git push --force origin "$SYNC_BRANCH"
          title="chore(registry): sync catalogue from the MCP Registry"
          if gh pr view "$SYNC_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" --title "$title" --body-file registry-sync-report.md
          else
            gh pr create --base main --head "$SYNC_BRANCH" --title "$title" --body-file registry-sync-report.md --label catalog-health
          fi
